<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060915">
<title>Shed Hot Sudoku</title>
<style>
:root{--bg:#060915;--panel:#0c1325;--panel2:#111b31;--line:#2d5f83;--cyan:#29c8ff;--blue:#147cff;--pink:#ff38c8;--purple:#9a4dff;--gold:#ffbf38;--green:#68e35f;--red:#ff5c65;--text:#eef7ff;--muted:#8ca6bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{touch-action:manipulation}body{margin:0;background:radial-gradient(circle at 15% 5%,rgba(255,56,200,.18),transparent 24%),radial-gradient(circle at 60% 25%,rgba(41,200,255,.12),transparent 28%),linear-gradient(180deg,#050812,#07101d 55%,#040710);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;min-height:100vh;overflow-x:hidden}button{font:inherit;touch-action:manipulation;position:relative;z-index:2}.app{max-width:1500px;margin:auto;padding:14px}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.brand{font-weight:1000;letter-spacing:.02em;font-size:clamp(28px,4vw,62px);line-height:.9;text-transform:uppercase;text-shadow:0 0 10px #ff38c8,0 0 25px rgba(41,200,255,.7)}.brand span:first-child{color:#ff75db}.brand span:last-child{color:#67d8ff;display:block}.topstats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:linear-gradient(180deg,#101a2d,#09111f);border:1px solid #263e60;border-radius:12px;padding:9px 12px;font-weight:900}.pill b{color:var(--gold)}.layout{display:grid;grid-template-columns:220px minmax(320px,660px) 320px;gap:14px;align-items:start}.panel{background:linear-gradient(180deg,rgba(15,25,45,.98),rgba(7,14,27,.98));border:1px solid #1c4e70;border-radius:16px;box-shadow:0 16px 50px rgba(0,0,0,.35)}.menu{display:grid;gap:10px}.menu button,.action,.difficulty button,.num{border:1px solid #235273;color:white;background:linear-gradient(180deg,#10213a,#0b1526);border-radius:12px;padding:13px;font-weight:900;cursor:pointer}.menu button.primary{font-size:24px;background:linear-gradient(180deg,#168eff,#0e58bd);box-shadow:0 0 20px rgba(41,200,255,.35)}.menu .purple{border-color:#8f39bf;background:linear-gradient(180deg,#31124a,#1a0d2b)}.menu .gold{border-color:#ac7912;background:linear-gradient(180deg,#49310b,#261b09)}.menu .green{border-color:#1e8f48;background:linear-gradient(180deg,#12351e,#0a2012)}.game{padding:14px}.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900;color:#79dbff}.boardwrap{aspect-ratio:1/1;width:100%;max-width:620px;margin:auto}.board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;height:100%;border:2px solid #79dbff;border-radius:10px;overflow:hidden;background:#08121e}.cell{position:relative;display:grid;place-items:center;border:1px solid rgba(120,200,240,.23);font-size:clamp(20px,4vw,36px);font-weight:800;cursor:pointer;user-select:none;touch-action:manipulation}.cell:nth-child(3n){border-right:2px solid #69d7ff}.cell:nth-child(9n){border-right:0}.cell.r3,.cell.r6{border-bottom:2px solid #69d7ff}.cell.given{color:#f3f7fb}.cell.user{color:#70cfff}.cell.wrong{color:#ff6868;background:rgba(255,60,60,.14)}.cell.sel{outline:3px solid #20b7ff;z-index:2;background:rgba(34,152,255,.16)}.cell.peer{background:rgba(37,115,180,.10)}.cell.same{background:rgba(25,132,220,.18)}.notes{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(8px,1.4vw,12px);color:#93b9d0}.controls{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin:12px 0}.num{padding:11px 2px;font-size:19px}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.action{padding:11px 6px}.action.on{border-color:#d157ff}.side{padding:14px;display:grid;gap:12px}.section h3{margin:0 0 8px;color:#67d8ff}.goal{background:#0d1729;border:1px solid #1d3d5e;border-radius:12px;padding:10px;margin-bottom:8px}.goalrow{display:flex;justify-content:space-between;gap:8px}.bar{height:8px;background:#132238;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#9a4dff,#ff38c8)}.difficulty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.difficulty button{font-size:12px;padding:9px 3px}.difficulty button.active{border-color:#d765ff}.stats{display:grid;gap:7px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #18304a;padding:7px 0}.banner{margin-top:12px;padding:13px;border-radius:14px;border:1px solid #895409;background:linear-gradient(90deg,#3a1b08,#171007);font-weight:900;color:#ffc55c;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;padding:18px;z-index:30}.modal.show{display:grid}.card{width:min(520px,100%);background:linear-gradient(180deg,#101c31,#080f1d);border:1px solid #2f6d95;border-radius:18px;padding:20px}.card .row{display:flex;gap:9px;flex-wrap:wrap}.card button{flex:1}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0c1727;border:1px solid #3271a0;border-radius:999px;padding:10px 16px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}@media(max-width:1050px){.layout{grid-template-columns:1fr}.menu{grid-template-columns:repeat(4,1fr)}.side{grid-template-columns:1fr 1fr}.brand{font-size:38px}}@media(max-width:700px){.app{padding:8px}.layout{display:block}.menu{grid-template-columns:1fr 1fr;margin-bottom:10px}.side{grid-template-columns:1fr;margin-top:10px}.actions{grid-template-columns:repeat(3,1fr)}.controls{gap:4px}.game{padding:8px}.cell{font-size:clamp(19px,7vw,30px)}}
</style>
</head>
<body>
<div class="app"><div class="topbar"><div class="brand"><span>Shed Hot</span><span>Sudoku</span></div><div class="topstats"><div class="pill">⚡ Lives <b id="lives">5</b></div><div class="pill">🪙 Coins <b id="coins">0</b></div><div class="pill">🔥 Streak <b id="streak">0</b></div><div class="pill">⭐ Level <b id="level">1</b></div></div></div><div class="layout"><div class="panel menu"><button class="primary" id="newBtn">▶ PLAY<br><small>NEW GAME</small></button><button class="purple" id="dailyBtn">📊 DAILY<br>CHALLENGE</button><button class="gold" id="goalsBtn">🎯 GOALS</button><button class="green" id="achBtn">⭐ ACHIEVEMENTS</button><button id="howBtn">📖 HOW TO PLAY</button><button id="soundBtn">🔊 SOUND <span id="soundLabel">ON</span></button><button id="resetBtn">♻ RESET</button></div><main class="panel game"><div class="gamehead"><span id="modeLabel">INTERMEDIATE</span><span id="timer">00:00</span></div><div class="boardwrap"><div class="board" id="board"></div></div><div class="controls" id="numPad"></div><div class="actions"><button class="action" id="undoBtn">↶ Undo</button><button class="action" id="eraseBtn">⌫ Erase</button><button class="action" id="notesBtn">✎ Notes</button><button class="action" id="hintBtn">💡 Hint</button><button class="action" id="pauseBtn">⏸ Pause</button></div><div class="banner">🔥 Mission: solve without 3 mistakes for bonus coins.</div></main><aside class="panel side"><section class="section"><h3>🎯 Daily Goals</h3><div class="goal"><div class="goalrow"><span>Solve 2 puzzles</span><b id="g1t">0/2</b></div><div class="bar"><div id="g1" class="fill" style="width:0"></div></div></div><div class="goal"><div class="goalrow"><span>Score 1000 points</span><b id="g2t">0/1000</b></div><div class="bar"><div id="g2" class="fill" style="width:0"></div></div></div><div class="goal"><div class="goalrow"><span>No-mistake win</span><b id="g3t">0/1</b></div><div class="bar"><div id="g3" class="fill" style="width:0"></div></div></div></section><section class="section"><h3>👑 Difficulty</h3><div class="difficulty" id="diffs"></div></section><section class="section"><h3>📈 Stats</h3><div class="stats"><div class="stat"><span>Puzzles solved</span><b id="solved">0</b></div><div class="stat"><span>Best time</span><b id="best">—</b></div><div class="stat"><span>Total score</span><b id="score">0</b></div><div class="stat"><span>Accuracy</span><b id="accuracy">100%</b></div></div></section></aside></div></div><div class="modal" id="modal"><div class="card" id="modalCard"></div></div><div class="toast" id="toast"></div>
<script>
const DIFFS={easy:{label:'Easy',remove:34,mult:1},medium:{label:'Medium',remove:42,mult:1.3},intermediate:{label:'Intermediate',remove:48,mult:1.7},hard:{label:'Hard',remove:53,mult:2.2},expert:{label:'Expert',remove:58,mult:3}};let difficulty=localStorage.shsDiff||'intermediate',solution=[],puzzle=[],current=[],notes=[],selected=null,mistakes=0,started=0,timerId=null,paused=false,noteMode=false,history=[],sound=true,daily=false;let P=JSON.parse(localStorage.getItem('shsProgress')||'null')||{coins:250,streak:0,level:1,solved:0,totalScore:0,best:{},correct:0,wrong:0,lastWin:null,goals:{date:'',solved:0,score:0,perfect:0},ach:{first:false,perfect:false,speed:false,hard:false,streak3:false}};function save(){localStorage.setItem('shsProgress',JSON.stringify(P))}function today(){return new Date().toISOString().slice(0,10)}function ensureGoals(){if(P.goals.date!==today())P.goals={date:today(),solved:0,score:0,perfect:0}}function shuffled(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function valid(b,r,c,n){for(let i=0;i<9;i++)if(b[r][i]===n||b[i][c]===n)return false;let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++)if(b[y][x]===n)return false;return true}function fillBoard(b,pos=0){if(pos===81)return true;let r=Math.floor(pos/9),c=pos%9;if(b[r][c])return fillBoard(b,pos+1);for(const n of shuffled([1,2,3,4,5,6,7,8,9])){if(valid(b,r,c,n)){b[r][c]=n;if(fillBoard(b,pos+1))return true;b[r][c]=0}}return false}function generate(){let b=Array.from({length:9},()=>Array(9).fill(0));fillBoard(b);solution=b.map(r=>[...r]);puzzle=b.map(r=>[...r]);let cells=shuffled([...Array(81).keys()]),rem=DIFFS[difficulty].remove;for(let i=0;i<rem;i++){let p=cells[i],r=Math.floor(p/9),c=p%9;puzzle[r][c]=0}current=puzzle.map(r=>[...r]);notes=Array.from({length:9},()=>Array.from({length:9},()=>new Set()))}function newGame(isDaily=false){clearInterval(timerId);daily=isDaily;selected=null;mistakes=0;noteMode=false;history=[];paused=false;generate();started=Date.now();timerId=setInterval(tick,1000);render();toast(isDaily?'Daily challenge started!':'Fresh puzzle. Try not to embarrass the species.')}function dailyChallenge(){difficulty=['medium','intermediate','hard'][new Date().getDate()%3];localStorage.shsDiff=difficulty;newGame(true)}function tick(){if(paused)return;document.getElementById('timer').textContent=formatTime(Math.floor((Date.now()-started)/1000))}function formatTime(s){let m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){ensureGoals();renderBoard();renderDiffs();renderStats();renderGoals();document.getElementById('modeLabel').textContent=(daily?'DAILY • ':'')+DIFFS[difficulty].label.toUpperCase();document.getElementById('coins').textContent=P.coins;document.getElementById('streak').textContent=P.streak;document.getElementById('level').textContent=P.level;document.getElementById('notesBtn').classList.toggle('on',noteMode)}function renderBoard(){const el=document.getElementById('board');el.innerHTML='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){let d=document.createElement('div');d.className='cell';if(r===2)d.classList.add('r3');if(r===5)d.classList.add('r6');let v=current[r][c],giv=puzzle[r][c]!==0;if(giv)d.classList.add('given');else if(v)d.classList.add('user');if(selected){let[sr,sc]=selected;if(r===sr&&c===sc)d.classList.add('sel');else if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))d.classList.add('peer');if(v&&current[sr][sc]&&v===current[sr][sc])d.classList.add('same')}if(v)d.textContent=v;else if(notes[r][c].size){let n=document.createElement('div');n.className='notes';for(let i=1;i<=9;i++){let s=document.createElement('span');s.textContent=notes[r][c].has(i)?i:'';n.appendChild(s)}d.appendChild(n)}if(!giv&&v&&v!==solution[r][c])d.classList.add('wrong');d.addEventListener('pointerup',()=>{selected=[r,c];renderBoard()});el.appendChild(d)}let pad=document.getElementById('numPad');pad.innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num';b.type='button';b.textContent=n;b.addEventListener('pointerup',()=>inputNum(n));pad.appendChild(b)}}function inputNum(n){if(!selected||paused)return;let[r,c]=selected;if(puzzle[r][c])return;if(noteMode){if(notes[r][c].has(n))notes[r][c].delete(n);else notes[r][c].add(n);renderBoard();return}history.push({r,c,val:current[r][c],notes:new Set(notes[r][c])});current[r][c]=n;notes[r][c].clear();if(n!==solution[r][c]){mistakes++;P.wrong++;toast('Nope. Sudoku gods remain unimpressed.');beep(120)}else{P.correct++;beep(440)}save();render();checkWin()}function erase(){if(!selected)return;let[r,c]=selected;if(puzzle[r][c])return;history.push({r,c,val:current[r][c],notes:new Set(notes[r][c])});current[r][c]=0;notes[r][c].clear();renderBoard()}function undo(){let h=history.pop();if(!h)return;current[h.r][h.c]=h.val;notes[h.r][h.c]=new Set(h.notes);renderBoard()}function toggleNotes(){noteMode=!noteMode;render()}function hint(){if(P.coins<40){toast('Hints cost 40 coins. Galactic economics is brutal.');return}let empt=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(current[r][c]!==solution[r][c])empt.push([r,c]);if(!empt.length)return;let[r,c]=empt[Math.floor(Math.random()*empt.length)];current[r][c]=solution[r][c];notes[r][c].clear();P.coins-=40;selected=[r,c];save();render();checkWin()}function checkWin(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(current[r][c]!==solution[r][c])return;clearInterval(timerId);let secs=Math.floor((Date.now()-started)/1000),base=Math.max(200,1600-secs*2-mistakes*120),pts=Math.floor(base*DIFFS[difficulty].mult)+(daily?300:0),perfect=mistakes===0;P.solved++;P.totalScore+=pts;P.coins+=Math.floor(pts/12);P.level=1+Math.floor(P.solved/5);P.best[difficulty]=!P.best[difficulty]||secs<P.best[difficulty]?secs:P.best[difficulty];let d=today();if(P.lastWin){let diff=Math.floor((new Date(d)-new Date(P.lastWin))/86400000);P.streak=diff===1?P.streak+1:diff===0?P.streak:1}else P.streak=1;P.lastWin=d;ensureGoals();P.goals.solved++;P.goals.score+=pts;if(perfect)P.goals.perfect=1;P.ach.first=true;if(perfect)P.ach.perfect=true;if(secs<180)P.ach.speed=true;if(difficulty==='hard'||difficulty==='expert')P.ach.hard=true;if(P.streak>=3)P.ach.streak3=true;save();render();showModal(`<h2>🔥 Puzzle smashed</h2><p><b>${pts}</b> points · ${formatTime(secs)} · ${mistakes} mistakes</p><button class="action" id="nextModal">Next puzzle</button>`);document.getElementById('nextModal').addEventListener('pointerup',()=>{closeModal();newGame()})}function renderDiffs(){let e=document.getElementById('diffs');e.innerHTML='';for(const k in DIFFS){let b=document.createElement('button');b.type='button';b.textContent=DIFFS[k].label;b.classList.toggle('active',k===difficulty);b.addEventListener('pointerup',()=>{difficulty=k;localStorage.shsDiff=k;newGame()});e.appendChild(b)}}function renderStats(){document.getElementById('solved').textContent=P.solved;document.getElementById('score').textContent=P.totalScore;document.getElementById('best').textContent=P.best[difficulty]?formatTime(P.best[difficulty]):'—';let acc=(P.correct+P.wrong)?Math.round(P.correct/(P.correct+P.wrong)*100):100;document.getElementById('accuracy').textContent=acc+'%'}function renderGoals(){ensureGoals();let g=P.goals;document.getElementById('g1').style.width=Math.min(100,g.solved/2*100)+'%';document.getElementById('g1t').textContent=Math.min(g.solved,2)+'/2';document.getElementById('g2').style.width=Math.min(100,g.score/1000*100)+'%';document.getElementById('g2t').textContent=Math.min(g.score,1000)+'/1000';document.getElementById('g3').style.width=(g.perfect?100:0)+'%';document.getElementById('g3t').textContent=g.perfect?'1/1':'0/1'}function showAchievements(){let a=P.ach;showModal(`<h2>⭐ Achievements</h2><p>${a.first?'✅':'⬜'} First Blood</p><p>${a.perfect?'✅':'⬜'} Flawless</p><p>${a.speed?'✅':'⬜'} Speed Demon</p><p>${a.hard?'✅':'⬜'} Big Brain</p><p>${a.streak3?'✅':'⬜'} On Fire</p><button class="action" id="closeModalBtn">Close</button>`);document.getElementById('closeModalBtn').addEventListener('pointerup',closeModal)}function showGoals(){showModal(`<h2>🎯 Goals</h2><p>Daily goals reset each day.</p><p>${P.goals.solved}/2 puzzles<br>${P.goals.score}/1000 points<br>${P.goals.perfect?1:0}/1 perfect win</p><button class="action" id="closeModalBtn">Back</button>`);document.getElementById('closeModalBtn').addEventListener('pointerup',closeModal)}function showHow(){showModal(`<h2>📖 How to play</h2><p>Fill every row, column and 3×3 box with numbers 1–9 without repeats.</p><p>Notes pencils candidates. Hint reveals a correct square for 40 coins.</p><button class="action" id="closeModalBtn">Got it</button>`);document.getElementById('closeModalBtn').addEventListener('pointerup',closeModal)}function pause(){paused=true;showModal(`<h2>⏸ Paused</h2><button class="action" id="resumeBtn">Resume</button>`);document.getElementById('resumeBtn').addEventListener('pointerup',()=>{paused=false;closeModal()})}function showModal(x){document.getElementById('modalCard').innerHTML=x;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function toggleSound(){sound=!sound;document.getElementById('soundLabel').textContent=sound?'ON':'OFF'}function beep(freq){if(!sound)return;try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let a=new AC(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.03;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.07)}catch(e){}}function resetProgress(){if(confirm('Reset all progress?')){localStorage.removeItem('shsProgress');location.reload()}}function bind(id,fn){document.getElementById(id).addEventListener('pointerup',fn,{passive:true})}bind('newBtn',()=>newGame());bind('dailyBtn',dailyChallenge);bind('goalsBtn',showGoals);bind('achBtn',showAchievements);bind('howBtn',showHow);bind('soundBtn',toggleSound);bind('resetBtn',resetProgress);bind('undoBtn',undo);bind('eraseBtn',erase);bind('notesBtn',toggleNotes);bind('hintBtn',hint);bind('pauseBtn',pause);ensureGoals();save();newGame();
</script></body></html>
